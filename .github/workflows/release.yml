name: Release

# Pushing a tag such as v1.0.0 builds every package and makes a draft release with them, which stays private
# until someone publishes it on GitHub. The tag must match the version in CMakeLists.txt and the AppStream file.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cmake_version="$(sed -n 's/^    VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          pkgbuild_version="$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)"
          [ "$tag" = "$cmake_version" ] || { echo "The tag says $tag, but CMakeLists.txt says $cmake_version"; exit 1; }
          [ "$tag" = "$pkgbuild_version" ] || { echo "The tag says $tag, but the PKGBUILD says $pkgbuild_version"; exit 1; }
          grep -q "<release version=\"$tag\"" packaging/linux/io.github.hachigodesu.Papertrail.metainfo.xml \
              || { echo "The AppStream file has no release $tag"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: check-version
    uses: ./.github/workflows/windows-package.yml

  appimage:
    needs: check-version
    uses: ./.github/workflows/appimage.yml

  flatpak:
    needs: check-version
    uses: ./.github/workflows/flatpak.yml

  draft-release:
    needs: [check-version, windows, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Gather the files
        run: |
          version="${{ needs.check-version.outputs.version }}"
          mkdir dist
          cp artifacts/windows-package/* dist/
          cp artifacts/appimage/Papertrail-x86_64.AppImage "dist/Papertrail-$version-x86_64.AppImage"
          cp artifacts/flatpak/Papertrail.flatpak "dist/Papertrail-$version.flatpak"
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Make a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
              --title "Papertrail ${{ needs.check-version.outputs.version }}" \
              --notes-file docs/release-notes.md
