name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
      # Plain configure rather than a preset: the action's MSYS2 isn't at C:/msys64.
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel cmake git ninja qt6-base
      - uses: actions/checkout@v4
      - run: cmake --preset linux-debug
      - run: cmake --build --preset linux-debug
      - run: ctest --preset linux-debug

  # Built on Ubuntu 22.04 (glibc 2.35), the oldest system release AppImages support.
  appimage:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git python3 python3-venv \
            libgl1-mesa-dev libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libwayland-client0 libwayland-cursor0 libwayland-egl1
          # Ubuntu 22.04's CMake is older than the project needs.
          python3 -m venv /opt/tools
          /opt/tools/bin/pip install aqtinstall cmake ninja
          echo /opt/tools/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - run: aqt install-qt linux desktop 6.12.0 linux_gcc_64 --outputdir /opt/Qt
      - run: bash packaging/linux/build-appimage.sh "$PWD/appimage-output"
        env:
          QT_ROOT: /opt/Qt/6.12.0/gcc_64
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: appimage-output/Papertrail-x86_64.AppImage
          if-no-files-found: error

  appimage-smoke:
    needs: appimage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libglib2.0-0 tar gzip
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 tar gzip
          - image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libglib2.0-0 tar gzip
          - image: fedora:latest
            install: dnf install -y libglvnd-glx libglvnd-egl libglvnd-opengl fontconfig dbus-libs glib2 tar gzip
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install libglvnd fontconfig libdbus-1-3 libglib-2_0-0 tar gzip
          - image: archlinux:latest
            install: pacman -Syu --noconfirm libglvnd fontconfig dbus glib2 tar gzip
    container: ${{ matrix.image }}
    steps:
      - name: Install the libraries a desktop system already has
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - run: sh packaging/linux/smoke-test-appimage.sh Papertrail-x86_64.AppImage

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgl1-mesa-dev libxkbcommon-dev
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.12.0'
      - run: cmake --preset linux-debug
      - run: cmake --build --preset linux-debug
      - run: ctest --preset linux-debug
