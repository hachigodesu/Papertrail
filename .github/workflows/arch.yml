name: Arch

on:
  push:
    branches: ['**'] # Not tags: a release is tagged on a commit whose tests have already passed.
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm base-devel cmake git ninja qt6-base libmupdf djvulibre libsecret zlib tesseract leptonica
      - uses: actions/checkout@v4
      - run: cmake --preset linux-debug
      - run: cmake --build --preset linux-debug
      - run: ctest --preset linux-debug
