name: AppImage

on:
  push:
    branches: ['**'] # Tags go through the release workflow, which reuses this run's package.
  pull_request:
  workflow_call: # From the release workflow.

jobs:
  # Built on Ubuntu 22.04 (glibc 2.35), the oldest system release AppImages support.
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          # libpulse0 is for Qt's own Multimedia library, which plays the natural voices and links PulseAudio's client
          # library: every desktop has it, but this image doesn't.
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git python3 python3-venv \
            libgl1-mesa-dev libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libdjvulibre-dev libsecret-1-dev pkg-config zlib1g-dev libtesseract-dev libleptonica-dev \
            flite1-dev libxkbcommon-dev libspeechd2 libpulse0
          # Ubuntu 22.04's CMake is older than the project needs.
          python3 -m venv /opt/tools
          /opt/tools/bin/pip install aqtinstall cmake ninja
          echo /opt/tools/bin >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /opt/mupdf-cache
          key: mupdf-ubuntu-22.04-1.28.5
      - run: bash packaging/linux/install-mupdf.sh /opt/mupdf-cache
      - run: aqt install-qt linux desktop 6.12.0 linux_gcc_64 --outputdir /opt/Qt -m qtspeech qtmultimedia
      - run: bash packaging/linux/build-qt-flite.sh
        env:
          QT_ROOT: /opt/Qt/6.12.0/gcc_64
      - run: bash packaging/linux/build-appimage.sh "$PWD/appimage-output"
        env:
          QT_ROOT: /opt/Qt/6.12.0/gcc_64
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: appimage-output/Papertrail-x86_64.AppImage
          if-no-files-found: error

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            install: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libglib2.0-0 tar gzip
          - image: ubuntu:24.04
            install: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libglib2.0-0t64 tar gzip
          # A desktop always has OpenSSL, which the AppImage uses for secure connections, but Debian's image doesn't.
          - image: debian:12
            install: apt-get update && apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libfontconfig1 libdbus-1-3 libglib2.0-0 libssl3 tar gzip
          - image: fedora:latest
            install: dnf install -y libglvnd-glx libglvnd-egl libglvnd-opengl fontconfig dbus-libs glib2 tar gzip
          - image: opensuse/tumbleweed
            install: zypper --non-interactive install libglvnd fontconfig libdbus-1-3 libglib-2_0-0 tar gzip
          - image: archlinux:latest
            install: pacman -Syu --noconfirm libglvnd fontconfig dbus glib2 tar gzip
    container: ${{ matrix.image }}
    steps:
      - name: Install the libraries a desktop system already has
        run: ${{ matrix.install }}
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: appimage
      - run: sh packaging/linux/smoke-test-appimage.sh Papertrail-x86_64.AppImage
